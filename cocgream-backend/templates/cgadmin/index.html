{% verbatim %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CockroachGram · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
:root{
  --bg:#f7f8fa;--card:#fff;--surface:#f3f4f6;--surface-2:#e9ecef;
  --border:#e5e7eb;--border-strong:#d4d4d8;
  --accent:#c8720a;--accent-hover:#a85e08;--accent-soft:#fef3e2;--accent-border:#fde4b8;
  --text:#0f172a;--text-2:#475569;--text-muted:#94a3b8;
  --danger:#dc2626;--success:#16a34a;--info:#2563eb;
  --zebra:#fafafa;--r:8px;--r-lg:12px;--side-w:240px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
ul{list-style:none;margin:0;padding:0}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:99px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--border-strong)}

.app{display:grid;grid-template-columns:var(--side-w) 1fr;min-height:100vh}
@media (max-width:1100px){.app{--side-w:64px}}

.side{position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.side-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);min-height:60px}
.side-head .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;font-size:14px;flex:none}
.side-head .wm{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap;line-height:1.15}
.side-head .wm small{display:block;font-size:9.5px;color:var(--text-muted);font-weight:500;letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
@media (max-width:1100px){.side-head .wm,.nav-label,.group-label{display:none}}

.nav{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:14px}
.nav-group{display:flex;flex-direction:column;gap:2px}
.group-label{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);padding:4px 12px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:7px;color:var(--text-2);font-size:13.5px;font-weight:500;cursor:pointer;transition:background .12s,color .12s;white-space:nowrap}
.nav-item:hover{background:var(--surface);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent)}

.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;gap:12px;min-height:60px}
.top .search{flex:1;max-width:480px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 12px}
.top .search input{flex:1;background:none;border:0;outline:none;font-size:13.5px}
.top .search kbd{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-size:11px;color:var(--text-muted);font-family:inherit}
.env-badge{background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12px;padding:5px 10px;border-radius:99px;border:1px solid var(--accent-border)}
.top .icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:8px;color:var(--text-2);position:relative}
.top .icon-btn:hover{background:var(--surface);color:var(--text)}
.top .dot{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--danger);border:2px solid var(--card)}
.top .me{display:flex;align-items:center;gap:8px;padding:3px 12px 3px 3px;border-radius:99px;border:1px solid var(--border);cursor:pointer}
.top .me:hover{background:var(--surface)}
.top .me .av{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}

.main{padding:24px;max-width:1480px}
.page-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:20px;gap:16px;flex-wrap:wrap}
.page-head h1{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px}
.page-head .sub{color:var(--text-muted);font-size:13.5px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;font-size:13px;font-weight:500;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text-2);transition:border-color .12s,color .12s,background .12s}
.btn:hover{border-color:var(--border-strong);color:var(--text);background:var(--surface)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-hover)}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg)}
.card.padded{padding:20px 22px}
.card-head{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-head h3{font-size:14px;font-weight:600;margin:0}
.card-head .sub{font-size:12px;color:var(--text-muted)}

.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
@media (max-width:1100px){.stat-row{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 20px;transition:border-color .15s,box-shadow .15s}
.stat:hover{border-color:var(--border-strong);box-shadow:0 1px 3px rgba(15,23,42,.04)}
.stat .label{font-size:11.5px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em}
.stat .num{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .delta{display:inline-flex;align-items:center;gap:3px;margin-top:8px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px}
.stat .delta.up{background:#ecfdf5;color:var(--success)}
.stat .delta.down{background:#fef2f2;color:var(--danger)}
.stat .delta.neutral{background:var(--surface);color:var(--text-muted)}

.grid-2{display:grid;grid-template-columns:1fr 380px;gap:14px;margin-bottom:20px}
@media (max-width:1100px){.grid-2{grid-template-columns:1fr}}

.table-wrap{overflow:auto;max-height:calc(100vh - 220px)}
.table{width:100%;border-collapse:collapse}
.table th{text-align:left;padding:10px 14px;font-size:11.5px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:1}
.table td{padding:11px 14px;font-size:13.5px;border-bottom:1px solid var(--border);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table tbody tr:hover td{background:var(--zebra)}
.table td.num,.table th.num{text-align:right;font-variant-numeric:tabular-nums}
.name-cell{display:flex;align-items:center;gap:10px}
.av{width:32px;height:32px;border-radius:50%;background:var(--surface);color:var(--text);display:grid;place-items:center;font-size:12px;font-weight:600;border:1px solid var(--border);flex:none}
.nm{font-weight:600}
.handle{color:var(--text-muted);font-size:12.5px}

.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:600}
.chip.amber{background:var(--accent-soft);color:var(--accent)}
.chip.green{background:#ecfdf5;color:var(--success)}
.chip.red{background:#fef2f2;color:var(--danger)}
.chip.blue{background:#eff6ff;color:var(--info)}
.chip.gray{background:var(--surface);color:var(--text-2);border:1px solid var(--border)}
.verified{color:var(--accent)}

.activity .item{display:flex;gap:10px;padding:12px 18px;border-bottom:1px solid var(--border);align-items:flex-start}
.activity .item:last-child{border-bottom:0}
.activity .body{flex:1;min-width:0}
.activity .nm{font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.activity .detail{color:var(--text-2);font-size:12.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.activity .time{color:var(--text-muted);font-size:11.5px;margin-top:4px}

.trending .item{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--border);cursor:pointer}
.trending .item:last-child{border-bottom:0}
.trending .item:hover{background:var(--surface)}
.trending .rank{font-size:13px;font-weight:700;color:var(--text-muted);width:22px;font-variant-numeric:tabular-nums}
.trending .tag{font-weight:600;color:var(--accent)}
.trending .count{margin-left:auto;color:var(--text-muted);font-size:12.5px;font-variant-numeric:tabular-nums}

.bars{padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.bars .bar-row{display:grid;grid-template-columns:140px 1fr 50px;align-items:center;gap:10px;font-size:12.5px}
.bars .bar{background:var(--surface);border-radius:99px;height:6px;overflow:hidden}
.bars .bar>div{height:100%;background:var(--accent);border-radius:99px}
.bars .count{text-align:right;color:var(--text-muted);font-variant-numeric:tabular-nums}

.empty{padding:60px 20px;text-align:center;color:var(--text-muted);font-size:13.5px}
.empty b{color:var(--text);display:block;margin-bottom:6px;font-size:14px}

.toast-container{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:100}
.toast{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:11px 14px;box-shadow:0 4px 14px rgba(15,23,42,.08);font-size:13.5px;max-width:340px;animation:slideUp .22s ease-out}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.toast.success{border-left:3px solid var(--success)}
.toast.error{border-left:3px solid var(--danger)}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="side-head">
      <div class="mark">🪳</div>
      <div class="wm">CockroachGram<small>Admin</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div>
    <div class="top">
      <div class="search">
        <i data-lucide="search" style="width:16px;height:16px;color:var(--text-muted)"></i>
        <input placeholder="Search members, posts, hashtags…" id="searchInput">
        <kbd>⌘K</kbd>
      </div>
      <div style="flex:1"></div>
      <span class="env-badge">PROD · 155.248.250.88</span>
      <button class="icon-btn" onclick="location.hash='notifications'">
        <i data-lucide="bell" style="width:18px;height:18px"></i>
        <span class="dot" id="bellDot" hidden></span>
      </button>
      <button class="me" onclick="window.location.href='/admin/logout/'">
        <span class="av" id="meAv">A</span>
        <span style="font-size:13px;font-weight:600" id="meName">admin</span>
      </button>
    </div>
    <main class="main" id="main"></main>
  </div>
</div>
<div class="toast-container" id="toasts"></div>

<script>
const NAV = [
  { label: 'Overview', items: [{ id:'dashboard', icon:'layout-dashboard', label:'Dashboard' }] },
  { label: 'Movement', items: [{ id:'members',   icon:'users',            label:'Members' }] },
  { label: 'Content',  items: [
    { id:'posts',    icon:'message-square-text', label:'Posts' },
    { id:'hashtags', icon:'hash',                label:'Hashtags' },
  ]},
  { label: 'Alerts', items: [
    { id:'notifications', icon:'bell',     label:'Notifications' },
    { id:'activity',      icon:'activity', label:'Activity' },
  ]},
  { label: 'System', items: [{ id:'settings', icon:'settings', label:'Settings' }] },
];

const API = {
  async _get(path) {
    const r = await fetch(path, { credentials:'same-origin', headers:{Accept:'application/json'} });
    if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
    return r.json();
  },
  stats:         () => API._get('/api/admin/stats/'),
  members:       () => API._get('/api/admin/members/'),
  posts:         () => API._get('/api/admin/posts/'),
  notifications: () => API._get('/api/admin/notifications/'),
  activity:      () => API._get('/api/admin/activity/'),
  trending:      () => API._get('/api/trending/?window=week'),
  me:            () => API._get('/api/users/me/'),
};

const STATE = { route: location.hash.slice(1) || 'dashboard' };
const $ = (s, r=document) => r.querySelector(s);

const fmt = n => {
  if (n == null) return '—';
  if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (n >= 1000)    return (n/1000).toFixed(1) + 'K';
  return n.toLocaleString();
};
const rel = iso => {
  const d = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (d < 60) return d + 's ago';
  if (d < 3600) return Math.floor(d/60) + 'm ago';
  if (d < 86400) return Math.floor(d/3600) + 'h ago';
  return Math.floor(d/86400) + 'd ago';
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const deltaPill = pct => {
  if (pct == null || pct === 0) return '<span class="delta neutral">no change</span>';
  const cls = pct > 0 ? 'up' : 'down';
  const arrow = pct > 0 ? '↑' : '↓';
  return '<span class="delta ' + cls + '">' + arrow + ' ' + Math.abs(pct).toFixed(1) + '% vs yesterday</span>';
};

function toast(msg, kind) {
  const t = document.createElement('div');
  t.className = 'toast ' + (kind || 'success');
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

function renderNav() {
  $('#nav').innerHTML = NAV.map(g =>
    '<div class="nav-group"><div class="group-label">' + esc(g.label) + '</div>' +
    g.items.map(it =>
      '<div class="nav-item ' + (it.id === STATE.route ? 'active' : '') + '" data-route="' + it.id + '">' +
      '<i data-lucide="' + it.icon + '" class="icon" style="width:16px;height:16px"></i>' +
      '<span class="nav-label">' + esc(it.label) + '</span></div>'
    ).join('') + '</div>'
  ).join('');
  $('#nav').onclick = e => {
    const item = e.target.closest('.nav-item');
    if (item) location.hash = item.dataset.route;
  };
}

const statCard = (label, num, delta) =>
  '<div class="stat"><div class="label">' + esc(label) + '</div><div class="num">' + num + '</div>' + (delta || '') + '</div>';

const engRow = (label, n) =>
  '<div style="display:flex;justify-content:space-between;align-items:center">' +
  '<span style="color:var(--text-2);font-size:13px">' + esc(label) + '</span>' +
  '<b style="font-variant-numeric:tabular-nums;font-size:15px">' + fmt(n) + '</b></div>';

function loadingHero(title, sub) {
  return '<div class="page-head"><div><h1>' + esc(title) + '</h1><div class="sub">' + esc(sub) + '</div></div></div>' +
    '<div class="card padded"><div style="display:flex;align-items:center;gap:10px;color:var(--text-muted);font-size:13px">' +
    '<i data-lucide="loader-2" class="spin" style="width:16px;height:16px"></i> Loading…</div></div>';
}

function renderDashboard(s) {
  if (!s) return loadingHero('Dashboard', 'Fetching live stats…');
  const m = s.members, p = s.posts_24h, r = s.reposts_24h, a = s.active_today;
  return '' +
    '<div class="page-head"><div><h1>Dashboard</h1><div class="sub">Live from the database · refreshed ' + rel(s.generated_at) + '</div></div>' +
    '<button class="btn" id="refresh"><i data-lucide="refresh-cw" style="width:14px;height:14px"></i> Refresh</button></div>' +
    '<div class="stat-row">' +
      statCard('Total members', fmt(m.total),  deltaPill(m.delta_pct)) +
      statCard('Active today',  fmt(a.value),  '<span class="delta neutral">login &lt; 24h</span>') +
      statCard('Posts · 24h',   fmt(p.value),  deltaPill(p.delta_pct)) +
      statCard('Reposts · 24h', fmt(r.value),  deltaPill(r.delta_pct)) +
    '</div>' +
    '<div class="grid-2">' +
      '<div class="card"><div class="card-head"><h3>Members by state</h3><span class="sub">Top ' + (s.top_states || []).length + '</span></div>' +
      '<div class="bars" id="bars"></div></div>' +
      '<div class="card"><div class="card-head"><h3>Trending now</h3><span class="sub">Last 7 days</span></div>' +
      '<ul class="trending" id="trending"></ul></div>' +
    '</div>' +
    '<div class="grid-2">' +
      '<div class="card"><div class="card-head"><h3>Live activity</h3><span class="sub">Recent signups &amp; posts</span></div>' +
      '<div class="activity" id="activity"></div></div>' +
      '<div class="card padded"><h3 style="font-size:14px;font-weight:600;margin:0 0 14px">Engagement · last 24h</h3>' +
      '<div style="display:flex;flex-direction:column;gap:12px">' +
        engRow('Likes',        s.likes_24h) +
        engRow('Comments',     s.comments_24h) +
        engRow('Reposts',      r.value) +
        engRow('Follows · 7d', s.follows_7d) +
        '<hr style="border:0;border-top:1px solid var(--border);margin:6px 0">' +
        engRow('Total hashtags',       s.hashtags_count) +
        engRow('Unread notifications', s.unread_notifications) +
        engRow('Verified members',     m.verified) +
      '</div></div>' +
    '</div>';
}

function fillBars(states) {
  const max = states.length ? states[0].count : 1;
  $('#bars').innerHTML = states.length ? states.map(s =>
    '<div class="bar-row"><span>' + esc(s.state) + '</span>' +
    '<div class="bar"><div style="width:' + ((s.count / max) * 100) + '%"></div></div>' +
    '<span class="count">' + fmt(s.count) + '</span></div>'
  ).join('') : '<div class="empty" style="padding:30px">No state data yet.</div>';
}

function fillTrending(trends) {
  $('#trending').innerHTML = trends.length ? trends.slice(0, 8).map((t, i) =>
    '<li class="item">' +
    '<span class="rank">' + String(i + 1).padStart(2, '0') + '</span>' +
    '<span class="tag">' + esc(t.tag) + '</span>' +
    (t.hot ? '<span class="chip amber">HOT</span>' : '') +
    '<span class="count">' + esc(t.count) + '</span></li>'
  ).join('') : '<div class="empty" style="padding:30px">No trending tags yet.</div>';
}

function fillActivity(items) {
  $('#activity').innerHTML = items.length ? items.slice(0, 12).map(it =>
    '<div class="item"><span class="av">' + esc(it.initials) + '</span>' +
    '<div class="body"><div class="nm">' + esc(it.name) +
    (it.verified ? ' <span class="verified">✓</span>' : '') +
    '<span class="chip ' + (it.type === 'signup' ? 'green' : 'blue') + '">' + esc(it.type) + '</span></div>' +
    '<div class="detail">' + esc(it.detail) + '</div>' +
    '<div class="time">' + rel(it.at) + ' · ' + esc(it.handle) + '</div></div></div>'
  ).join('') : '<div class="empty" style="padding:30px">No activity yet.</div>';
}

function renderMembers(rows) {
  if (!rows) return loadingHero('Members', 'Fetching member list…');
  const body = rows.length === 0
    ? '<tr><td colspan="7"><div class="empty">No members yet.</div></td></tr>'
    : rows.map(u =>
      '<tr><td><div class="name-cell"><span class="av">' + esc(u.initials) + '</span>' +
      '<div><div class="nm">' + esc(u.name || u.username) +
      (u.verified ? ' <span class="verified">✓</span>' : '') + '</div>' +
      '<div class="handle">' + esc(u.handle) + '</div></div></div></td>' +
      '<td><span class="chip gray" style="font-family:ui-monospace,monospace">#' + esc(u.member_no) + '</span></td>' +
      '<td>' + esc(u.state || '—') + '</td>' +
      '<td class="num">' + fmt(u.stats && u.stats.posts || 0) + '</td>' +
      '<td class="num">' + fmt(u.stats && u.stats.followers || 0) + '</td>' +
      '<td>' + (u.verified ? '<span class="chip amber">Verified</span>' : '<span class="chip gray">Member</span>') + '</td>' +
      '<td><span style="color:var(--text-muted);font-size:12.5px">' + esc(u.joined_label || '') + '</span></td></tr>'
    ).join('');
  return '<div class="page-head"><div><h1>Members</h1><div class="sub">' + rows.length.toLocaleString() + ' total · live from the database</div></div></div>' +
    '<div class="card" style="overflow:hidden"><div class="table-wrap"><table class="table">' +
    '<thead><tr><th>Member</th><th>Member #</th><th>State</th>' +
    '<th class="num">Posts</th><th class="num">Followers</th><th>Status</th><th>Joined</th></tr></thead>' +
    '<tbody>' + body + '</tbody></table></div></div>';
}

function renderPosts(rows) {
  if (!rows) return loadingHero('Posts (Roars)', 'Fetching recent posts…');
  const body = rows.length === 0
    ? '<tr><td colspan="8"><div class="empty">No posts yet.</div></td></tr>'
    : rows.map(p => {
      const a = p.author || {};
      const tags = (p.hashtags || []).slice(0, 2)
        .map(h => '<span class="chip amber">#' + esc(h) + '</span>').join(' ') ||
        '<span style="color:var(--text-muted)">—</span>';
      return '<tr><td><div class="name-cell"><span class="av">' + esc(a.initials || '?') + '</span>' +
        '<div><div class="nm">' + esc(a.name || '') +
        (a.verified ? ' <span class="verified">✓</span>' : '') + '</div>' +
        '<div class="handle">' + esc(a.handle || '') + '</div></div></div></td>' +
        '<td style="max-width:340px"><span style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">' +
        esc(p.text) + '</span></td>' +
        '<td>' + tags + '</td>' +
        '<td><span class="chip ' + (p.audience === 'public' ? 'gray' : 'blue') + '">' + esc(p.audience) + '</span></td>' +
        '<td class="num">' + fmt(p.likes) + '</td>' +
        '<td class="num">' + fmt(p.comments) + '</td>' +
        '<td class="num">' + fmt(p.reposts) + '</td>' +
        '<td><span style="color:var(--text-muted);font-size:12.5px">' + esc(p.time) + '</span></td></tr>';
    }).join('');
  return '<div class="page-head"><div><h1>Posts (Roars)</h1><div class="sub">' + rows.length.toLocaleString() + ' most recent</div></div></div>' +
    '<div class="card" style="overflow:hidden"><div class="table-wrap"><table class="table">' +
    '<thead><tr><th>Author</th><th>Text</th><th>Hashtags</th><th>Audience</th>' +
    '<th class="num">♥</th><th class="num">💬</th><th class="num">↻</th><th>When</th></tr></thead>' +
    '<tbody>' + body + '</tbody></table></div></div>';
}

function renderNotifications(rows) {
  if (!rows) return loadingHero('Notifications', 'Fetching system-wide notifications…');
  const typeChip = { like:'red', comment:'blue', follow:'green', repost:'amber', mention:'blue' };
  const body = rows.length === 0
    ? '<tr><td colspan="5"><div class="empty">No notifications.</div></td></tr>'
    : rows.map(n =>
      '<tr><td><span class="chip ' + (typeChip[n.type] || 'gray') + '">' + esc(n.type) + '</span></td>' +
      '<td><div class="name-cell"><span class="av">' + esc(n.initials) + '</span>' +
      '<div><div class="nm">' + esc(n.name) +
      (n.verified ? ' <span class="verified">✓</span>' : '') + '</div></div></div></td>' +
      '<td>' + esc(n.text) + '</td>' +
      '<td style="max-width:280px;color:var(--text-2);font-size:12.5px">' +
      (n.preview ? esc(n.preview) : '<span style="color:var(--text-muted)">—</span>') + '</td>' +
      '<td><span style="color:var(--text-muted);font-size:12.5px">' + esc(n.time) + ' ago</span></td></tr>'
    ).join('');
  return '<div class="page-head"><div><h1>Notifications</h1><div class="sub">System-wide feed · ' + rows.length + ' recent</div></div></div>' +
    '<div class="card" style="overflow:hidden"><div class="table-wrap"><table class="table">' +
    '<thead><tr><th>Type</th><th>Actor</th><th>Action</th><th>Preview</th><th>When</th></tr></thead>' +
    '<tbody>' + body + '</tbody></table></div></div>';
}

function renderHashtags(trends) {
  if (!trends) return loadingHero('Hashtags', 'Fetching trending hashtags…');
  const body = trends.length === 0
    ? '<tr><td colspan="5"><div class="empty">No hashtags yet.</div></td></tr>'
    : trends.map(t =>
      '<tr><td><b style="font-variant-numeric:tabular-nums">' + t.rank + '</b></td>' +
      '<td><span style="color:var(--accent);font-weight:600">' + esc(t.tag) + '</span></td>' +
      '<td><span style="color:var(--text-2);font-size:13px">' + esc(t.category) + '</span></td>' +
      '<td class="num">' + esc(t.count) + '</td>' +
      '<td>' + (t.hot ? '<span class="chip amber">🔥 HOT</span>' : '<span class="chip gray">tracking</span>') + '</td></tr>'
    ).join('');
  return '<div class="page-head"><div><h1>Hashtags &amp; Trending</h1><div class="sub">' + trends.length + ' active tags (last 7 days)</div></div></div>' +
    '<div class="card" style="overflow:hidden"><div class="table-wrap"><table class="table">' +
    '<thead><tr><th>Rank</th><th>Hashtag</th><th>Category</th><th class="num">Posts</th><th>Status</th></tr></thead>' +
    '<tbody>' + body + '</tbody></table></div></div>';
}

function renderActivity(items) {
  if (!items) return loadingHero('Activity feed', 'Fetching recent events…');
  const body = items.length === 0 ? '<div class="empty">No activity yet.</div>' :
    items.map(it =>
      '<div class="item"><span class="av">' + esc(it.initials) + '</span>' +
      '<div class="body"><div class="nm">' + esc(it.name) +
      (it.verified ? ' <span class="verified">✓</span>' : '') +
      '<span class="chip ' + (it.type === 'signup' ? 'green' : 'blue') + '">' + esc(it.type) + '</span></div>' +
      '<div class="detail">' + esc(it.detail) + '</div>' +
      '<div class="time">' + rel(it.at) + ' · ' + esc(it.handle) + '</div></div></div>'
    ).join('');
  return '<div class="page-head"><div><h1>Activity feed</h1><div class="sub">Most recent ' + items.length + ' events across the platform</div></div></div>' +
    '<div class="card"><div class="activity">' + body + '</div></div>';
}

const settingRow = (key, val, desc) =>
  '<div style="display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border);gap:24px">' +
  '<div><div style="font-weight:600;font-size:13.5px">' + esc(key) + '</div>' +
  '<div style="color:var(--text-muted);font-size:12.5px;margin-top:2px">' + esc(desc) + '</div></div>' +
  '<span style="color:var(--text);font-size:12.5px;font-family:ui-monospace,monospace;background:var(--surface);padding:4px 10px;border-radius:6px;white-space:nowrap">' +
  esc(val) + '</span></div>';

function renderSettings() {
  return '<div class="page-head"><div><h1>Settings</h1><div class="sub">Read-only snapshot of the live backend configuration.</div></div></div>' +
    '<div class="card padded"><div style="display:flex;flex-direction:column">' +
    settingRow('Environment', 'PROD', 'Live backend on Oracle Cloud at 155.248.250.88.') +
    settingRow('API base', 'http://155.248.250.88/api', 'Used by the Flutter app; override with --dart-define=API_BASE_URL.') +
    settingRow('Auth · access token', '60 minutes', 'JWT_ACCESS_LIFETIME_MINUTES.') +
    settingRow('Auth · refresh token', '14 days', 'JWT_REFRESH_LIFETIME_DAYS.') +
    settingRow('Refresh rotation', 'On + blacklist', 'ROTATE_REFRESH_TOKENS, BLACKLIST_AFTER_ROTATION.') +
    settingRow('Storage', 'Local filesystem', 'USE_S3=false on this 1 GB box. Swap to S3 / R2 / B2 for prod.') +
    settingRow('Throttling', '60/min anon · 300/min user', 'Plus a 10/sec burst guard and a 20/min auth cap.') +
    settingRow('Raw Django admin', '/admin/', 'For model CRUD this UI does not cover yet.') +
    settingRow('Log out', '/admin/logout/', 'Ends this admin session.') +
    '</div></div>';
}

async function route() {
  STATE.route = location.hash.slice(1) || 'dashboard';
  renderNav();
  const main = $('#main');
  try {
    if (STATE.route === 'dashboard') {
      main.innerHTML = renderDashboard(null);
      window.lucide && window.lucide.createIcons();
      const [stats, trending, activity] = await Promise.all([API.stats(), API.trending(), API.activity()]);
      main.innerHTML = renderDashboard(stats);
      fillBars(stats.top_states || []);
      fillTrending(trending.results || []);
      fillActivity(activity.results || []);
      $('#refresh').onclick = () => route();
      $('#bellDot').hidden = (stats.unread_notifications || 0) === 0;
    } else if (STATE.route === 'members') {
      main.innerHTML = renderMembers(null);
      window.lucide && window.lucide.createIcons();
      main.innerHTML = renderMembers(await API.members());
    } else if (STATE.route === 'posts') {
      main.innerHTML = renderPosts(null);
      window.lucide && window.lucide.createIcons();
      main.innerHTML = renderPosts(await API.posts());
    } else if (STATE.route === 'notifications') {
      main.innerHTML = renderNotifications(null);
      window.lucide && window.lucide.createIcons();
      main.innerHTML = renderNotifications(await API.notifications());
    } else if (STATE.route === 'hashtags') {
      main.innerHTML = renderHashtags(null);
      window.lucide && window.lucide.createIcons();
      const t = await API.trending();
      main.innerHTML = renderHashtags(t.results || []);
    } else if (STATE.route === 'activity') {
      main.innerHTML = renderActivity(null);
      window.lucide && window.lucide.createIcons();
      const a = await API.activity();
      main.innerHTML = renderActivity(a.results || []);
    } else if (STATE.route === 'settings') {
      main.innerHTML = renderSettings();
    } else {
      main.innerHTML = '<div class="empty"><b>Unknown route</b>' + esc(STATE.route) + '</div>';
    }
  } catch (e) {
    main.innerHTML = '<div class="page-head"><div><h1>Error</h1></div></div>' +
      '<div class="card padded"><div class="empty"><b>Could not load this page.</b>' + esc(e.message) +
      '<br><br><button class="btn primary" onclick="route()">Retry</button>' +
      '<button class="btn" style="margin-left:6px" onclick="window.location.href=\'/admin/login/?next=/cgadmin/\'">Re-login</button></div></div>';
    toast('Error: ' + e.message, 'error');
  }
  window.lucide && window.lucide.createIcons();
}

window.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    $('#searchInput').focus();
  }
});

async function boot() {
  try {
    const me = await API.me();
    $('#meName').textContent = me.username;
    $('#meAv').textContent = (me.initials || me.username[0] || 'A').slice(0, 2);
  } catch (_) { /* server will redirect if needed */ }
  window.addEventListener('hashchange', route);
  route();
}
boot();
</script>
</body>
</html>
