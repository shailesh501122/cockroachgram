{% verbatim %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CockroachGram Â· Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ---------- TOKENS ---------- */
:root{
  --bg:#1a0f00;
  --card:#231500;
  --surface:#2d1d05;
  --surface-2:#352208;
  --border:#3a2710;
  --border-strong:#4a3318;
  --accent-from:#c8720a;
  --accent-to:#ff9f2e;
  --accent-glow:rgba(255,159,46,.35);
  --accent-soft:rgba(255,159,46,.08);
  --text:#f5e6c8;
  --text-2:#c9b99a;
  --text-muted:#8a7a5a;
  --danger:#e03030;
  --success:#2ecc71;
  --info:#4ea1ff;
  --zebra:#2a1500;
  --r-card:14px;
  --r-input:9px;
  --r-chip:999px;
  --shadow-glow:0 0 0 1px rgba(255,159,46,.25), 0 12px 40px -12px var(--accent-glow);
  --side-w:240px;
}

/* ---------- RESET ---------- */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{min-height:100vh;background:
  radial-gradient(1200px 600px at 100% -10%, rgba(200,114,10,.08), transparent 60%),
  radial-gradient(900px 500px at -10% 110%, rgba(255,159,46,.05), transparent 60%),
  var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
ul{list-style:none;margin:0;padding:0}
::selection{background:var(--accent-to);color:#1a0f00}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:99px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--border-strong)}

/* ---------- TYPO HELPERS ---------- */
.t-display{font-family:'Bebas Neue',sans-serif;letter-spacing:.04em;line-height:.95}
.t-syne{font-family:'Syne',sans-serif;font-weight:700;letter-spacing:-.005em}
.t-mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-muted)}
.text-2{color:var(--text-2)}

/* ---------- APP SHELL ---------- */
.app{display:grid;grid-template-columns:var(--side-w) 1fr;min-height:100vh}
.app.collapsed{--side-w:64px}
@media (max-width:1100px){.app{--side-w:64px}}

/* ---------- SIDEBAR ---------- */
.side{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,#1f1200 0%,#170b00 100%);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;z-index:30}
.side-head{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid var(--border);min-height:64px}
.side-head .mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent-from),var(--accent-to));box-shadow:0 6px 18px -6px var(--accent-glow);font-size:18px;flex:none}
.side-head .wm{font-family:'Syne',sans-serif;font-weight:800;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.side-head .wm small{display:block;font-family:'DM Sans',sans-serif;font-weight:500;font-size:10px;color:var(--text-muted);letter-spacing:.15em;text-transform:uppercase}
.app.collapsed .side-head .wm,.app.collapsed .nav-label,.app.collapsed .group-label,.app.collapsed .side-foot .info{display:none}
@media (max-width:1100px){.side-head .wm,.nav-label,.group-label,.side-foot .info{display:none}}

.nav{flex:1;overflow-y:auto;padding:10px 10px 16px;display:flex;flex-direction:column;gap:14px}
.nav-group{display:flex;flex-direction:column;gap:2px}
.group-label{font-family:'Syne',sans-serif;font-weight:700;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted);padding:8px 12px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;color:var(--text-2);font-size:13.5px;font-weight:500;cursor:pointer;transition:background .12s ease,color .12s ease,box-shadow .12s ease;position:relative;white-space:nowrap}
.nav-item .ic{flex:none;width:18px;height:18px;display:grid;place-items:center}
.nav-item .ic svg{width:18px;height:18px}
.nav-item:hover{background:rgba(255,255,255,.025);color:var(--text)}
.nav-item.active{background:linear-gradient(135deg,var(--accent-from),var(--accent-to));color:#1a0f00;font-weight:600;box-shadow:0 6px 22px -8px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.2)}
.nav-item.active .ic svg{stroke:#1a0f00}
.nav-item .badge{margin-left:auto;background:rgba(255,159,46,.18);color:var(--accent-to);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;font-family:'DM Sans',sans-serif}
.nav-item.active .badge{background:rgba(26,15,0,.18);color:#1a0f00}
.app.collapsed .nav-item .badge,.app.collapsed .nav-item{justify-content:center}
.app.collapsed .nav-item .badge{display:none}
@media (max-width:1100px){.nav-item .badge{display:none}.nav-item{justify-content:center}}

.side-foot{border-top:1px solid var(--border);padding:12px;display:flex;align-items:center;gap:10px}
.side-foot .info{flex:1;min-width:0}
.side-foot .info .name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot .info .role{font-size:11px;color:var(--text-muted)}

/* ---------- MAIN ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:100vh}

/* ---------- TOPBAR ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 28px;background:rgba(26,15,0,.6);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border-bottom:1px solid var(--border);min-height:64px}
.topbar .collapse-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);display:grid;place-items:center;color:var(--text-2)}
.topbar .collapse-btn:hover{background:var(--surface);color:var(--text)}
.crumb{font-family:'Syne',sans-serif;font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px}
.crumb .root{color:var(--text-muted);font-weight:600}
.crumb .sep{color:var(--text-muted)}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(45,29,5,.55);border:1px solid var(--border);border-radius:10px;color:var(--text-muted);cursor:pointer;transition:border-color .15s ease,background .15s ease}
.search:hover{border-color:var(--border-strong);background:rgba(45,29,5,.8)}
.search svg{width:16px;height:16px;flex:none}
.search .hint{margin-left:auto;display:flex;gap:4px}
.kbd{font-family:ui-monospace,monospace;font-size:11px;padding:2px 6px;border-radius:5px;background:var(--surface);border:1px solid var(--border);color:var(--text-2);min-width:18px;text-align:center}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:10px}

/* ---------- ENV BADGE ---------- */
.env-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:linear-gradient(135deg,rgba(200,114,10,.18),rgba(255,159,46,.1));border:1px solid rgba(255,159,46,.3);font-size:11.5px;font-weight:600;color:var(--accent-to);letter-spacing:.04em}
.env-badge .dot{width:6px;height:6px;border-radius:99px;background:var(--accent-to);box-shadow:0 0 8px var(--accent-to);animation:pulse 2s ease-in-out infinite}
.env-badge .ip{font-family:ui-monospace,monospace;color:var(--text-2);font-weight:500}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ---------- ICON BTN / BELL ---------- */
.icon-btn{position:relative;width:36px;height:36px;border-radius:10px;border:1px solid var(--border);display:grid;place-items:center;color:var(--text-2);transition:all .12s ease}
.icon-btn:hover{background:var(--surface);color:var(--text);border-color:var(--border-strong)}
.icon-btn .count{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg);font-family:'DM Sans',sans-serif}

/* ---------- AVATAR ---------- */
.avatar{position:relative;flex:none;display:inline-grid;place-items:center;border-radius:99px;background:linear-gradient(135deg,#3a2710,#2d1d05);color:var(--text);font-family:'Syne',sans-serif;font-weight:700;overflow:hidden}
.avatar.ring{box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--accent-to)}
.avatar .vbadge{position:absolute;bottom:-2px;right:-2px;width:14px;height:14px;border-radius:99px;background:linear-gradient(135deg,var(--accent-from),var(--accent-to));display:grid;place-items:center;border:2px solid var(--bg);font-size:9px}
.avatar.s24{width:24px;height:24px;font-size:10px}
.avatar.s28{width:28px;height:28px;font-size:11px}
.avatar.s32{width:32px;height:32px;font-size:12px}
.avatar.s40{width:40px;height:40px;font-size:14px}
.avatar.s96{width:96px;height:96px;font-size:36px}

/* ---------- CONTENT ---------- */
.page{padding:28px 32px 64px;display:flex;flex-direction:column;gap:24px;max-width:1600px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:44px;letter-spacing:.03em;line-height:1;margin:0}
.page-sub{color:var(--text-muted);margin-top:6px;font-size:13.5px}
.page-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- BUTTONS ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:9px;font-weight:600;font-size:13px;border:1px solid var(--border);background:var(--surface);color:var(--text);transition:all .12s ease;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--border-strong)}
.btn svg{width:15px;height:15px}
.btn-primary{background:linear-gradient(135deg,var(--accent-from),var(--accent-to));color:#1a0f00;border-color:transparent;box-shadow:0 6px 22px -10px var(--accent-glow)}
.btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 26px -8px var(--accent-glow)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn-ghost:hover{background:var(--surface);color:var(--text)}
.btn-danger{background:rgba(224,48,48,.1);border-color:rgba(224,48,48,.3);color:#ff7676}
.btn-danger:hover{background:rgba(224,48,48,.2)}
.btn-danger.solid{background:var(--danger);color:#fff;border-color:transparent}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:7px}
.btn-icon{width:32px;height:32px;padding:0;display:grid;place-items:center}

/* ---------- CARDS ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden}
.card-pad{padding:18px 20px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border)}
.card-head h3{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;margin:0;letter-spacing:-.005em}
.card-head .sub{color:var(--text-muted);font-size:12px}

/* ---------- GRID HELPERS ---------- */
.grid{display:grid;gap:18px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2-1{grid-template-columns:2fr 1fr}
.grid-1-1{grid-template-columns:1fr 1fr}
@media (max-width:1200px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-2-1,.grid-1-1{grid-template-columns:1fr}}
@media (max-width:700px){.grid-4{grid-template-columns:1fr}.grid-3{grid-template-columns:1fr}}

/* ---------- STAT CARD ---------- */
.stat{padding:18px 20px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);position:relative;overflow:hidden;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;cursor:default}
.stat:hover{box-shadow:var(--shadow-glow);transform:translateY(-1px);border-color:var(--border-strong)}
.stat .label{font-family:'Syne',sans-serif;font-weight:600;font-size:11.5px;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.stat .big{font-family:'Bebas Neue',sans-serif;font-size:46px;line-height:1;letter-spacing:.02em}
.stat .big.accent{background:linear-gradient(135deg,var(--accent-from),var(--accent-to));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .foot{margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:99px;font-family:'DM Sans',sans-serif}
.delta.up{background:rgba(46,204,113,.12);color:var(--success)}
.delta.down{background:rgba(224,48,48,.12);color:#ff7676}
.delta.flat{background:var(--surface);color:var(--text-muted)}
.spark{height:36px;width:100%}
.spark.lg{height:60px}

/* ---------- CHIP ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--r-chip);font-size:11.5px;font-weight:600;background:var(--surface);color:var(--text-2);border:1px solid var(--border);font-family:'DM Sans',sans-serif;line-height:1.4;white-space:nowrap}
.chip.accent{background:rgba(255,159,46,.12);color:var(--accent-to);border-color:rgba(255,159,46,.25)}
.chip.danger{background:rgba(224,48,48,.12);color:#ff8a8a;border-color:rgba(224,48,48,.25)}
.chip.success{background:rgba(46,204,113,.12);color:#7be0a3;border-color:rgba(46,204,113,.25)}
.chip.info{background:rgba(78,161,255,.1);color:#9cc6ff;border-color:rgba(78,161,255,.22)}
.chip.dot::before{content:"";width:6px;height:6px;border-radius:99px;background:currentColor;display:inline-block;opacity:.85}
.chip-tag{background:transparent;color:var(--accent-to);border-color:rgba(255,159,46,.2);padding:2px 7px;font-size:11px;font-weight:600;font-family:'Syne',sans-serif}
.chip-tag::before{content:"#";opacity:.7;margin-right:1px}

/* ---------- PILL TABS ---------- */
.pilltabs{display:inline-flex;gap:4px;padding:4px;background:var(--card);border:1px solid var(--border);border-radius:11px}
.pilltabs button{padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--text-2);display:inline-flex;align-items:center;gap:7px;transition:all .12s ease}
.pilltabs button:hover{color:var(--text)}
.pilltabs button.active{background:linear-gradient(135deg,var(--accent-from),var(--accent-to));color:#1a0f00;box-shadow:0 4px 14px -6px var(--accent-glow)}
.pilltabs .count{background:rgba(26,15,0,.15);color:inherit;padding:1px 7px;border-radius:99px;font-size:10.5px;font-weight:700;font-family:'DM Sans',sans-serif}
.pilltabs button:not(.active) .count{background:var(--surface);color:var(--text-muted)}

/* ---------- DATA TABLE ---------- */
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden}
.table-toolbar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.table-toolbar .search-input{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;padding:7px 11px;background:var(--surface);border:1px solid var(--border);border-radius:9px}
.table-toolbar .search-input svg{width:14px;height:14px;color:var(--text-muted)}
.table-toolbar .search-input input{flex:1;background:transparent;border:0;outline:0;font-size:13px;color:var(--text)}
.table-toolbar .search-input input::placeholder{color:var(--text-muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{padding:5px 11px;border-radius:99px;font-size:12px;font-weight:500;border:1px solid var(--border);background:transparent;color:var(--text-2);transition:all .12s ease}
.fchip:hover{background:var(--surface);color:var(--text)}
.fchip.on{background:rgba(255,159,46,.12);border-color:rgba(255,159,46,.35);color:var(--accent-to)}

.scroll-x{overflow-x:auto}
table.dt{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.dt thead th{position:sticky;top:0;background:var(--card);text-align:left;font-family:'Syne',sans-serif;font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap;z-index:1}
table.dt thead th.sortable{cursor:pointer;user-select:none}
table.dt thead th.sortable:hover{color:var(--text)}
table.dt thead th .sort{display:inline-flex;margin-left:4px;opacity:.5}
table.dt thead th .sort.on{opacity:1;color:var(--accent-to)}
table.dt tbody td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
table.dt tbody tr{background:var(--card);transition:background .1s ease,box-shadow .1s ease;cursor:pointer;position:relative}
table.dt tbody tr:nth-child(even){background:var(--zebra)}
table.dt tbody tr:hover{background:var(--surface);box-shadow:inset 2px 0 0 var(--accent-to)}
table.dt tbody tr.selected{background:rgba(255,159,46,.08);box-shadow:inset 2px 0 0 var(--accent-to)}
table.dt tbody tr:last-child td{border-bottom:0}
table.dt td.num,table.dt th.num{text-align:right;font-variant-numeric:tabular-nums}
table.dt td.actions{text-align:right;width:1%}
table.dt .check{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--border-strong);display:inline-grid;place-items:center;background:transparent;cursor:pointer}
table.dt tr.selected .check,table.dt .check.on{background:linear-gradient(135deg,var(--accent-from),var(--accent-to));border-color:transparent}
table.dt .check svg{width:10px;height:10px;color:#1a0f00;display:none}
table.dt tr.selected .check svg,table.dt .check.on svg{display:block}
.user-cell{display:flex;align-items:center;gap:10px}
.user-cell .meta{display:flex;flex-direction:column;min-width:0}
.user-cell .name{font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
.user-cell .handle{color:var(--text-muted);font-size:11.5px}
.snippet{max-width:340px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.kebab{width:26px;height:26px;border-radius:7px;display:inline-grid;place-items:center;color:var(--text-muted)}
.kebab:hover{background:var(--surface);color:var(--text)}

.table-foot{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--border);font-size:12.5px;color:var(--text-muted);flex-wrap:wrap;gap:10px}
.pager{display:flex;align-items:center;gap:4px}
.pager button{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--text-2);border:1px solid transparent}
.pager button:hover{background:var(--surface);color:var(--text)}
.pager button.active{background:var(--surface-2);color:var(--text);border-color:var(--border-strong)}
.pager button:disabled{opacity:.35;cursor:not-allowed}

/* bulk action ribbon */
.bulk-bar{display:none;align-items:center;gap:14px;padding:10px 16px;background:linear-gradient(90deg,rgba(255,159,46,.14),rgba(255,159,46,.05));border-bottom:1px solid rgba(255,159,46,.25);animation:slidedown .18s ease}
.bulk-bar.on{display:flex}
.bulk-bar .count{font-weight:700;color:var(--accent-to);font-family:'Syne',sans-serif}
.bulk-bar .sep{width:1px;height:18px;background:var(--border-strong)}
@keyframes slidedown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ---------- LIVE FEED ---------- */
.feed{display:flex;flex-direction:column;max-height:520px;overflow-y:auto}
.feed-row{display:flex;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border);align-items:flex-start;font-size:13px;animation:fadeIn .25s ease}
.feed-row:last-child{border-bottom:0}
.feed-row .body{flex:1;min-width:0}
.feed-row .body .line{color:var(--text-2)}
.feed-row .body .line b{color:var(--text);font-weight:600}
.feed-row .time{font-size:11.5px;color:var(--text-muted);font-family:ui-monospace,monospace;white-space:nowrap}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- TRENDING LIST ---------- */
.trend-row{display:grid;grid-template-columns:24px 1fr auto 80px;gap:12px;padding:11px 18px;border-bottom:1px solid var(--border);align-items:center;cursor:pointer;transition:background .1s ease}
.trend-row:hover{background:var(--surface)}
.trend-row:last-child{border-bottom:0}
.trend-row .rank{font-family:'Bebas Neue',sans-serif;color:var(--text-muted);font-size:18px;text-align:center}

const el = (tag, attrs={}, ...kids) => {
  const n = document.createElement(tag);
  for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'data' && typeof v === 'object') Object.entries(v).forEach(([dk,dv]) => n.dataset[dk]=dv);
    else if (v === true) n.setAttribute(k,'');
    else n.setAttribute(k, v);
  }
  for (const k of kids.flat()) {
    if (k == null || k === false) continue;
    n.append(k.nodeType ? k : document.createTextNode(k));
  }
  return n;
};

function parseHash() {

  if (!h) return ['dashboard', null];
  const parts = h.split('/');
  return [parts[0], parts[1] || null];
}
function go(route, param) {
  if (param) location.hash = `#/${route}/${encodeURIComponent(param)}`;
  else location.hash = `#/${route}`;
}

const fmt = {
  big: n => n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1).replace('.0','')+'K' : String(n),
  n: n => n.toLocaleString('en-IN'),
  ago: (mins) => {
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    if (mins < 1440) return Math.floor(mins/60) + 'h ago';
    if (mins < 1440*30) return Math.floor(mins/1440) + 'd ago';
    return Math.floor(mins/(1440*30)) + 'mo ago';
  },
  date: d => d.toLocaleDateString('en-IN', {day:'2-digit',month:'short',year:'numeric'}),
  time: d => d.toLocaleTimeString('en-IN', {hour:'2-digit',minute:'2-digit',hour12:false}),
};

function sparkline(data, w=120, h=36, color='var(--accent-to)') {
  const max = Math.max(...data), min = Math.min(...data);
  const span = max - min || 1;
  const step = w / (data.length - 1);
  const pts = data.map((v,i)=>`${(i*step).toFixed(1)},${(h - 4 - ((v-min)/span)*(h-8)).toFixed(1)}`);
  const path = 'M' + pts.join(' L');
  const area = `${path} L${w},${h} L0,${h} Z`;
  const last = pts[pts.length-1].split(',');
  const id = 'g'+Math.random().toString(36).slice(2,7);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".35"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${id})"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="2.2" fill="${color}"/>
  </svg>`;
}

function deltaPill(pct) {
  if (pct == null) return '';
  const cls = pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat';
  const sign = pct > 0 ? '+' : '';
  const ic = pct > 0 ? 'arrow-up-right' : pct < 0 ? 'arrow-down-right' : 'minus';
  return `<span class="delta ${cls}">${icon(ic,10)} ${sign}${pct.toFixed(1)}%</span>`;
}

function statCard({label, value, delta, spark, accent=false, sub=''}) {
  return `<div class="stat">
    <div class="label">${label}<span class="muted" style="font-size:11px;text-transform:none;letter-spacing:.02em;font-family:'DM Sans',sans-serif;font-weight:500">${sub||''}</span></div>
    <div class="big ${accent?'accent':''}">${value}</div>
    <div class="foot">
      ${deltaPill(delta)}
      ${spark ? sparkline(spark) : ''}
    </div>
  </div>`;
}

    let av = a[k], bv = b[k];

    return dir==='asc' ? av-bv : bv-av;

  const total = rows.length;
  const pages = Math.max(1, Math.ceil(total / state.memberPer));

        <button class="fchip ${state.memberFilter==='unverified'?'on':''}" data-filter="unverified">Unverified</button>

        ${sortHead('member_no','Member #')}

      <tbody>

function pagerButtons(cur, pages) {
  const out = [];
  const range = (a,b) => { for(let i=a;i<=b;i++) out.push(i); };
  if (pages <= 7) range(1, pages);
  else {
    range(1, 2);
    if (cur > 4) out.push('â€¦');
    range(Math.max(3, cur-1), Math.min(pages-2, cur+1));
    if (cur < pages-3) out.push('â€¦');
    range(pages-1, pages);
  }
  return out.map(p => p === 'â€¦'
    ? `<span style="padding:0 4px;color:var(--text-muted)">â€¦</span>`
    : `<button class="${p===cur?'active':''}" data-page="${p}">${p}</button>`).join('');
}

function wireMembers() {
  const root = qs('#view');
  const inp = qs('#memberSearch', root);
  if (inp) inp.addEventListener('input', e => { state.memberSearch = e.target.value; state.memberPage=1; renderTableOnly(); });
  qsa('[data-filter]', root).forEach(b => b.addEventListener('click', () => { state.memberFilter = b.dataset.filter; state.memberPage=1; renderTableOnly(); }));
  qsa('th[data-sort]', root).forEach(h => h.addEventListener('click', () => {
    const k = h.dataset.sort;
    if (state.memberSort.k === k) state.memberSort.dir = state.memberSort.dir==='asc'?'desc':'asc';
    else { state.memberSort.k = k; state.memberSort.dir = 'asc'; }
    renderTableOnly();
  }));
  qsa('[data-check]', root).forEach(c => c.addEventListener('click', e => {
    e.stopPropagation();
    const id = c.dataset.check;
    if (id === 'all') {
      const ids = qsa('tbody tr', root).map(r => Number(qs('[data-check]', r)?.dataset.check)).filter(Boolean);
      if (state.memberSelected.size >= ids.length) state.memberSelected.clear();
      else ids.forEach(i => state.memberSelected.add(i));
    } else {
      const nid = Number(id);
      if (state.memberSelected.has(nid)) state.memberSelected.delete(nid);
      else state.memberSelected.add(nid);
    }
    renderTableOnly();
  }));
  qsa('tbody tr[data-handle]', root).forEach(r => r.addEventListener('click', () => go('members', r.dataset.handle)));
  qsa('.kebab', root).forEach(k => k.addEventListener('click', e => {
    e.stopPropagation();
    const m = MEMBERS.find(x => x.id === Number(k.dataset.kebab));
    toast('Action menu for ' + m.name, 'info');
  }));
  qsa('[data-bulk]', root).forEach(b => b.addEventListener('click', () => {
    const a = b.dataset.bulk;
    if (a === 'clear') state.memberSelected.clear();
    else if (a === 'delete') openDeleteModal(`${state.memberSelected.size} members`, () => { state.memberSelected.clear(); renderTableOnly(); toast(`Members deleted`, 'success'); }, 'DELETE');
    else { toast(`${a[0].toUpperCase()+a.slice(1)} queued for ${state.memberSelected.size} members`, 'success'); state.memberSelected.clear(); }
    renderTableOnly();
  }));
  qsa('[data-page]', root).forEach(b => b.addEventListener('click', () => {
    const v = b.dataset.page;
    const pages = Math.max(1, Math.ceil(MEMBERS.length / state.memberPer));
    if (v === 'prev') state.memberPage = Math.max(1, state.memberPage-1);
    else if (v === 'next') state.memberPage = Math.min(pages, state.memberPage+1);
    else state.memberPage = Number(v);
    renderTableOnly();
  }));
  const per = qs('#memberPer', root);
  if (per) per.addEventListener('change', e => { state.memberPer = Number(e.target.value); state.memberPage=1; renderTableOnly(); });
}
function renderTableOnly() {
  const wrap = qs('.table-wrap');
  if (!wrap) return;
  const focused = document.activeElement?.id;
  const ss = document.activeElement?.selectionStart;
  wrap.outerHTML = membersTable();
  reIcons();
  wireMembers();
  if (focused) {
    const f = document.getElementById(focused);
    if (f) { f.focus(); if (ss!=null && f.setSelectionRange) f.setSelectionRange(ss,ss); }
  }
}

function wirePosts() {
  qsa('[data-ptab]').forEach(b => b.addEventListener('click', () => { state.postTab = b.dataset.ptab; render(); }));
  const inp = qs('#postSearch');
  if (inp) inp.addEventListener('input', e => { state.postSearch = e.target.value; renderPostsTableOnly(); });
  qsa('th[data-psort]').forEach(h => h.addEventListener('click', () => {
    const k = h.dataset.psort;
    if (state.postSort.k === k) state.postSort.dir = state.postSort.dir==='asc'?'desc':'asc';
    else { state.postSort.k = k; state.postSort.dir = 'desc'; }
    renderPostsTableOnly();
  }));
  qsa('[data-pcheck]').forEach(c => c.addEventListener('click', e => {
    e.stopPropagation();
    const id = c.dataset.pcheck;
    if (state.postSelected.has(id)) state.postSelected.delete(id); else state.postSelected.add(id);
    renderPostsTableOnly();
  }));
  qsa('tr[data-postid]').forEach(r => r.addEventListener('click', () => {
    const p = POSTS.find(x => x.id === r.dataset.postid);
    if (p) openPostDrawer(p);
  }));
  qsa('[data-pkebab]').forEach(k => k.addEventListener('click', e => { e.stopPropagation(); toast('Post action menu', 'info'); }));
  qsa('[data-pbulk]').forEach(b => b.addEventListener('click', () => {
    const a = b.dataset.pbulk;
    if (a === 'clear') state.postSelected.clear();
    else if (a === 'delete') openDeleteModal(`${state.postSelected.size} posts`, () => { state.postSelected.clear(); renderPostsTableOnly(); toast('Posts deleted','success'); }, 'DELETE');
    else { toast(`${a} queued for ${state.postSelected.size} posts`, 'success'); state.postSelected.clear(); }
    renderPostsTableOnly();
  }));
}
function renderPostsTableOnly() {
  const wrap = qs('.table-wrap');
  if (!wrap) return;
  const focused = document.activeElement?.id;
  const ss = document.activeElement?.selectionStart;
  wrap.outerHTML = postsTable();
  reIcons();
  wirePosts();
  if (focused) { const f=document.getElementById(focused); if(f){f.focus(); if(ss!=null&&f.setSelectionRange) f.setSelectionRange(ss,ss);} }
}

          <span>${d.status==='success'?chip('Success','success dot'):chip(d.status,'danger dot')} <button class="btn btn-sm btn-ghost" style="margin-left:6px">Rollback</button></span>
        </div>`).join('');
    case 'danger':
      return settingsTitle('Danger Zone','Irreversible destructive actions.') +
        `<div class="danger-zone" style="margin:0">
          <h4>Purge media</h4>
          <p>Deletes every uploaded image and video that is not referenced by any active post. Cannot be undone.</p>
          <button class="btn btn-danger" id="dPurge"><i data-lucide="trash-2"></i>Purge media</button>
        </div>
        <div class="danger-zone">
          <h4>Reset demo data</h4>
          <p>Wipe seed accounts and re-seed with a fresh demo dataset. Production members are not affected.</p>
          <button class="btn btn-danger" id="dReset"><i data-lucide="rotate-ccw"></i>Reset demo</button>
        </div>
        <div class="danger-zone">
          <h4>Delete instance</h4>
          <p>Decommission this CockroachGram instance. All data is shredded after a 7-day grace period.</p>
          <button class="btn btn-danger" id="dInst"><i data-lucide="alert-triangle"></i>Delete instance</button>
        </div>`;
  }
  return '';
}
function settingsTitle(t,s) {
  return `<div style="margin:-4px 0 6px"><div class="t-syne" style="font-size:16px">${t}</div><div class="muted" style="font-size:13px">${s}</div></div>`;
}
function field(k, v, desc='') {
  return `<div class="field"><div class="k">${k}${desc?`<span class="desc">${desc}</span>`:''}</div><div>${v}</div></div>`;
}
function tog(on) { return `<div class="tog ${on?'on':''}" tabindex="0"></div>`; }

function wireSettings() {
  qsa('[data-set]').forEach(b => b.addEventListener('click', () => { state.settingsSection = b.dataset.set; render(); }));
  qsa('.tog').forEach(t => t.addEventListener('click', () => t.classList.toggle('on')));
  const p = qs('#dPurge'); if (p) p.onclick = () => openDeleteModal('all unreferenced media', () => toast('Media purge queued', 'success'), 'PURGE');
  const r = qs('#dReset'); if (r) r.onclick = () => openDeleteModal('demo dataset', () => toast('Demo data reset', 'success'), 'RESET');
  const i = qs('#dInst');  if (i) i.onclick = () => openDeleteModal('the production instance', () => toast('Instance deletion scheduled', 'error'), 'DELETE-PROD');
}

/* ============================================================
   FALLBACKS
   ============================================================ */
function viewActivity() {
  return `<div class="page">
    <div class="page-head"><div><h1 class="page-title">Activity feed</h1><div class="page-sub">Last 200 events across the platform</div></div></div>
    <div class="card"><div class="feed" style="max-height:none">${liveFeedRows(40)}</div></div>
  </div>`;
}
function viewStub(title, sub) {
  return `<div class="page">
    <div class="page-head"><div><h1 class="page-title">${title}</h1><div class="page-sub">${sub}</div></div></div>
    <div class="card"><div class="empty"><div class="roach">ðŸª³</div><h3>${title} surface</h3>
      <p>This screen reuses the same DataTable + filters pattern shown in Members and Posts. Wired into the same router.</p>
      <div class="row-flex" style="gap:8px"><button class="btn btn-primary" data-go="members"><i data-lucide="users"></i>Open Members</button><button class="btn" data-go="posts"><i data-lucide="megaphone"></i>Open Posts</button></div>
    </div></div>
  </div>`;
}

/* ============================================================
   OVERLAYS
   ============================================================ */
function openSO() { qs('#scrim').classList.add('on'); qs('#slideover').classList.add('on'); }
function closeSO() { qs('#scrim').classList.remove('on'); qs('#slideover').classList.remove('on'); }

function openDeleteModal(name, onConfirm, requiredText) {
  qs('#mTitle').textContent = `Delete ${name}?`;
  const reqText = requiredText || name;
  qs('#mBody').innerHTML = `This action is permanent and cannot be undone. To confirm, type <b>${reqText}</b> below.<input id="confirmInput" placeholder="${reqText}" autocomplete="off">`;
  const btn = qs('#mConfirm');
  btn.disabled = true;
  qs('#modal').classList.add('on');
  const inp = qs('#confirmInput');
  inp.focus();
  inp.addEventListener('input', () => { btn.disabled = inp.value !== reqText; });
  btn.onclick = () => { closeModal(); onConfirm(); };
}
function closeModal() { qs('#modal').classList.remove('on'); }

function toast(msg, variant='info') {
  const t = el('div', {class:`toast ${variant}`},
    el('div', {class:'ic', html: icon(variant==='success'?'check':variant==='error'?'x':'info', 14)}),
    el('div', {text: msg}));
  qs('#toasts').append(t);
  reIcons();
  setTimeout(() => { t.style.transition='opacity .25s, transform .25s'; t.style.opacity=0; t.style.transform='translateY(8px)'; }, 3200);
  setTimeout(() => t.remove(), 3500);
}

function buildCpalResults(q) {
  q = q.toLowerCase().trim();
  const groups = [];
  const navItems = NAV.flatMap(g => g.items).map(it => ({type:'nav', label:it.label, ic:it.ic, sub:'navigate', go: () => go(it.id)}));
  const members = MEMBERS.map(m => ({type:'member', label:m.name, ic:'user', sub:'@'+m.handle, go: () => go('members', m.handle)}));
  const posts   = POSTS.slice(0,15).map(p => ({type:'post', label:p.text.slice(0,55), ic:'megaphone', sub:p.id, go: () => openPostDrawer(p)}));
  const hashes  = HASHTAGS.map(h => ({type:'hashtag', label:'#'+h.tag, ic:'hash', sub:fmt.n(h.vol)+' posts', go: () => { state.hashtagSel=h.tag; go('hashtags'); }}));

  const filt = arr => q ? arr.filter(x => x.label.toLowerCase().includes(q) || (x.sub||'').toLowerCase().includes(q)) : arr.slice(0,5);
  groups.push({label:'Members', items: filt(members).slice(0,5)});
  groups.push({label:'Posts',   items: filt(posts).slice(0,5)});
  groups.push({label:'Hashtags',items: filt(hashes).slice(0,5)});
  groups.push({label:'Navigate',items: filt(navItems).slice(0,8)});
  return groups.filter(g => g.items.length);
}
function renderCpal() {
  const groups = buildCpalResults(state.cpalQuery);
  const flat = groups.flatMap(g => g.items);
  if (state.cpalIndex >= flat.length) state.cpalIndex = 0;
  let i = 0;
  qs('#cpalBody').innerHTML = groups.map(g => `
    <div class="cpal-group">
      <div class="lbl">${g.label}</div>
      ${g.items.map(it => { const idx = i++; return `<div class="cpal-item ${idx===state.cpalIndex?'active':''}" data-i="${idx}"><span class="ic">${icon(it.ic,13)}</span><span>${esc(it.label)}</span><span class="sub">${it.sub||''}</span></div>`; }).join('')}
    </div>`).join('') || `<div class="empty"><div class="roach">ðŸª³</div><h3>No results</h3></div>`;
  reIcons();
  qsa('#cpalBody .cpal-item').forEach(n => n.addEventListener('click', () => {
    flat[Number(n.dataset.i)].go();
    closeCpal();
  }));
}
function openCpal() { qs('#cpal').classList.add('on'); state.cpalQuery=''; state.cpalIndex=0; qs('#cpalInput').value=''; renderCpal(); setTimeout(()=>qs('#cpalInput').focus(),20); }
function closeCpal() { qs('#cpal').classList.remove('on'); }

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================================================
   MAIN RENDER
   ============================================================ */
function render() {
  const [route, param] = parseHash();
  state.route = route; state.param = param;
  renderNav();
  renderCrumb();

  let html = '';
  if (route === 'dashboard')                          html = viewDashboard();
  else if (route === 'members' && param)              html = viewMember(param);
  else if (route === 'members')                       html = viewMembers();
  else if (route === 'posts')                         html = viewPosts();
  else if (route === 'hashtags' || route==='trending') html = viewHashtags();
  else if (route === 'notifications')                 html = viewNotifications();
  else if (route === 'settings')                      html = viewSettings();
  else if (route === 'activity')                      html = viewActivity();
  else {
    const labels = {followers:'Followers',manifesto:'Manifesto signatures',comments:'Comments',media:'Media',likes:'Likes',reposts:'Reposts',bookmarks:'Bookmarks',audit:'Audit log',groups:'Groups & permissions',tokens:'API tokens',blacklist:'Token blacklist',reports:'Reports / Flags'};
    html = viewStub(labels[route] || 'Section', 'Filtered view sharing the same data layer.');
  }

  qs('#view').innerHTML = html;
  reIcons();

  if (route === 'members' && param) { const m=MEMBERS.find(x=>x.handle===param); if(m) wireMember(m); }
  else if (route === 'members') wireMembers();
  else if (route === 'posts') wirePosts();
  else if (route === 'hashtags' || route === 'trending') wireHashtags();
  else if (route === 'notifications') wireNotifications();
  else if (route === 'settings') wireSettings();

  qsa('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
  qsa('[data-hashtag]').forEach(b => b.addEventListener('click', () => { state.hashtagSel=b.dataset.hashtag; go('hashtags'); }));

  if (route === 'dashboard') {
    clearInterval(window.__liveTick);
    window.__liveTick = setInterval(() => {
      const f = qs('#liveFeed'); if (!f) return;
      f.insertAdjacentHTML('afterbegin', liveFeedRows(1));
      const rows = qsa('.feed-row', f);
      if (rows.length > 10) rows[rows.length-1].remove();
      reIcons();
    }, 3500);
  } else if (window.__liveTick) {
    clearInterval(window.__liveTick); window.__liveTick = null;
  }
}

/* ============================================================
   GLOBAL WIRING
   ============================================================ */
function initGlobal() {
  qs('#collapseBtn').addEventListener('click', () => qs('#app').classList.toggle('collapsed'));
  qs('#bellBtn').addEventListener('click', () => go('notifications'));
  qs('#userBtn').addEventListener('click', e => { e.stopPropagation(); qs('#userMenu').classList.toggle('on'); });
  document.addEventListener('click', e => {
    if (!e.target.closest('#userBtn')) qs('#userMenu').classList.remove('on');
  });

  qs('#searchBox').addEventListener('click', openCpal);
  qs('#searchBox').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') openCpal(); });

  qs('#scrim').addEventListener('click', () => { closeSO(); });
  qs('#soClose').addEventListener('click', closeSO);
  qs('#mCancel').addEventListener('click', closeModal);

  qs('#cpalInput').addEventListener('input', e => { state.cpalQuery = e.target.value; state.cpalIndex=0; renderCpal(); });
  qs('#cpal').addEventListener('click', e => { if (e.target.id === 'cpal') closeCpal(); });

  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openCpal(); return; }
    if (e.key === 'Escape') {
      if (qs('#cpal').classList.contains('on')) closeCpal();
      else if (qs('#modal').classList.contains('on')) closeModal();
      else if (qs('#slideover').classList.contains('on')) closeSO();
      return;
    }
    if (qs('#cpal').classList.contains('on')) {
      const items = qsa('#cpalBody .cpal-item');
      if (e.key === 'ArrowDown') { state.cpalIndex = Math.min(items.length-1, state.cpalIndex+1); renderCpal(); qs('#cpalInput').focus(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { state.cpalIndex = Math.max(0, state.cpalIndex-1); renderCpal(); qs('#cpalInput').focus(); e.preventDefault(); }
      else if (e.key === 'Enter') { const item = items[state.cpalIndex]; if (item) item.click(); }
    }
  });

  setTimeout(() => toast('Connected to PROD Â· 155.248.250.88', 'success'), 600);
}

if (!location.hash) location.hash = '#/dashboard';
initGlobal();
render();

})();
</script>
