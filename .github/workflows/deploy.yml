name: Deploy

# On push to main:  SSH into the Ubuntu host, pull the latest source,
# and roll the running compose stack with --build.
#
# Gated on the repo variable DEPLOY_ENABLED=true so the workflow doesn't try
# to deploy until secrets and the host are ready.

on:
  push:
    branches: [main]
    paths:
      - cocgream-backend/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false      # don't kill an in-flight deploy

permissions:
  contents: read

jobs:
  deploy:
    name: roll on host
    runs-on: ubuntu-latest
    if: vars.DEPLOY_ENABLED == 'true'
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ~/cockroachgram
            git fetch origin
            git reset --hard origin/main
            cd cocgream-backend
            chmod +x scripts/*.sh
            docker compose up -d --build
            docker image prune -f
            # Wait up to 60s for the health endpoint to go green.
            for i in $(seq 1 60); do
              if curl -fsS http://localhost/api/health/ >/dev/null; then
                echo "🪳 healthy after ${i}s"
                exit 0
              fi
              sleep 1
            done
            echo "🪳 health-check failed — rolling api logs:"
            docker compose logs --tail=80 api
            exit 1
