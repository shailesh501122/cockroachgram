name: Deploy

# On push to main:  build & push the backend image to GHCR,
# then SSH into the Ubuntu host and roll the running stack to the new image.

on:
  push:
    branches: [main]
    paths:
      - cocgream-backend/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false   # don't kill an in-flight deploy

permissions:
  contents: read
  packages: write              # push to ghcr.io

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cockroachgram-api

jobs:
  build:
    name: build & push image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - uses: docker/build-push-action@v6
        with:
          context: cocgream-backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: roll on host
    needs: build
    runs-on: ubuntu-latest
    if: vars.DEPLOY_ENABLED == 'true'   # flip the variable to enable deploys
    environment:
      name: production
      url: http://${{ secrets.SSH_HOST }}/api/health/
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ~/cockroachgram
            git fetch origin
            git reset --hard origin/main
            cd cocgream-backend
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull api
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            # Wait up to 30s for the health endpoint to come back green.
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8000/api/health/ >/dev/null; then
                echo "🪳 healthy after ${i}s"; exit 0
              fi
              sleep 1
            done
            echo "🪳 health-check failed — rolling logs:"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=80 api
            exit 1
