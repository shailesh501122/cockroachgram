name: Release APK

# On a `v*` tag, build a release APK and attach it to the GitHub release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # create / update releases

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cocGream
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: build release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ vars.PROD_API_BASE_URL || 'https://api.example.com/api' }}

      - uses: softprops/action-gh-release@v2
        with:
          files: cocGream/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
